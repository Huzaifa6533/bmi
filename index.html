<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>
<body>
    <h1>Body-Mass-Index</h1>
    <input type="number" name="" id="weight" placeholder="Enter Your Weight" step="any">
    <br><br>
    <input type="number" name="" id="height" placeholder="Enter Your Height (m)" step="any">
    <br><br>
    <input type="text" name="" id="gender" placeholder="Enter Your Gender" step="any">
    <br><br>
    <button  style="background-color: black; color: white; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; height: 28px; width: 130px; cursor: pointer;" onclick="calculateBMI()">Calculate BMI</button>
    <h2 style="color:#009999;" id="result"></h2>

    
    <script src="app.js"></script>
</body>
</html>
